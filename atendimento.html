<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puericultura - Atendimento</title>
<style>
  :root{
    --azul-noite:#0F3D57;
    --azul-medio:#1B6E8C;
    --azul-claro:#5FB8D9;
    --creme:#F7F9F6;
    --alerta:#C24B4B;
    --aviso:#C98A2C;
    --sucesso:#2E7D5B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
    background:var(--creme);
    color:var(--azul-noite);
    min-height:100vh;
  }
  header{
    background:linear-gradient(135deg, var(--azul-noite), var(--azul-medio));
    color:#fff;
    padding:22px 20px 26px;
    text-align:center;
  }
  header h1{ margin:0; font-size:22px; }
  header p{ margin:6px 0 0; font-size:13px; opacity:.85; }
  main{ max-width:480px; margin:0 auto; padding:20px 16px 60px; }
  .card{
    background:#fff;
    border-radius:14px;
    padding:20px;
    box-shadow:0 2px 10px rgba(15,61,87,0.08);
    margin-bottom:16px;
  }
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin:12px 0 6px;
    color:var(--azul-medio);
  }
  input, select{
    width:100%;
    padding:11px 12px;
    border:1.5px solid #DCE6E9;
    border-radius:8px;
    font-size:15px;
    font-family:inherit;
    color:var(--azul-noite);
    background:#FDFEFE;
  }
  input:focus, select:focus{ outline:none; border-color:var(--azul-claro); }
  button{
    width:100%;
    margin-top:14px;
    padding:14px;
    border:none;
    border-radius:10px;
    background:var(--azul-medio);
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
  }
  button:disabled{ background:#9FB9C4; cursor:not-allowed; }
  a.link-reagendar{
    display:block;
    text-align:center;
    margin-top:12px;
    color:var(--azul-medio);
    font-size:14px;
    font-weight:600;
    text-decoration:none;
    border:1.5px solid var(--azul-medio);
    border-radius:10px;
    padding:12px;
  }
  .resultado-busca{
    border:1px solid #E3ECEF;
    border-radius:10px;
    padding:12px;
    margin-top:8px;
    cursor:pointer;
  }
  .resultado-busca:hover{ background:#F1F7F9; }
  .resultado-busca strong{ display:block; font-size:15px; }
  .resultado-busca span{ font-size:12px; color:#5F7A85; }
  .item-agendado{
    border:1px solid #E3ECEF;
    border-radius:10px;
    padding:12px;
    margin-top:8px;
    cursor:pointer;
  }
  .item-agendado:hover{ background:#F1F7F9; }
  .item-agendado strong{ display:block; font-size:15px; }
  .item-agendado span{ font-size:12px; color:#5F7A85; }
  .crianca-selecionada{
    background:#EAF4F7;
    border-radius:10px;
    padding:14px;
    margin-bottom:10px;
  }
  .crianca-selecionada strong{ font-size:16px; }
  .crianca-selecionada .trocar{
    display:inline-block;
    margin-top:6px;
    font-size:12px;
    color:var(--azul-medio);
    text-decoration:underline;
    cursor:pointer;
  }
  .linha-dupla{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .campos-medida{ display:none; }
  .campos-medida.visivel{ display:block; }
  .aviso{
    margin-top:14px;
    padding:12px 14px;
    border-radius:9px;
    font-size:14px;
    display:none;
  }
  .aviso.sucesso{ display:block; background:#E4F3EC; color:var(--sucesso); border:1px solid #BFE3D0; }
  .aviso.erro{ display:block; background:#FBEAEA; color:var(--alerta); border:1px solid #F1C6C6; }
  footer{ text-align:center; font-size:12px; color:#7C97A2; padding-bottom:20px; }
  .oculto{ display:none; }
</style>
</head>
<body>

<header>
  <h1>Puericultura</h1>
  <p>ESF Flor do Cerrado - Atendimento</p>
</header>

<main>

  <div class="card" id="cardBusca">
    <label>Buscar criança (nome, ID ou CNS)</label>
    <input type="text" id="campoBusca" placeholder="Digite pelo menos 3 letras...">
    <div id="resultados"></div>
  </div>

  <div class="card oculto" id="cardCrianca">
    <div class="crianca-selecionada">
      <strong id="nomeCrianca"></strong>
      <div id="infoCrianca" style="font-size:13px;color:#5F7A85;margin-top:4px;"></div>
      <span class="trocar" id="btnTrocar">Trocar criança</span>
    </div>

    <div id="areaListaAgendados"></div>
  </div>

  <div class="card oculto" id="cardAtendimento">
    <label style="margin-top:0;">Consulta selecionada</label>
    <div id="resumoConsulta" style="font-size:14px;color:#5F7A85;margin-bottom:8px;"></div>

    <form id="formAtendimento">
      <label>Status</label>
      <select id="status" required>
        <option value="Compareceu">Compareceu</option>
        <option value="Faltou">Faltou</option>
        <option value="Remarcado">Remarcado</option>
      </select>

      <div id="camposMedida" class="campos-medida">
        <div class="linha-dupla">
          <div>
            <label>Peso (kg)</label>
            <input type="number" step="0.01" id="pesoKg">
          </div>
          <div>
            <label>Altura (cm)</label>
            <input type="number" step="0.1" id="alturaCm">
          </div>
        </div>
      </div>

      <label>Observações</label>
      <input type="text" id="observacoes">

      <button type="submit" id="btnSalvar">Salvar atendimento</button>
      <div id="aviso" class="aviso"></div>

      <a href="#" class="link-reagendar oculto" id="linkReagendar">Ver nova sugestão de agendamento →</a>
    </form>
  </div>

</main>

<footer>antonioresolve.com.br</footer>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbz9G6wxwGqE4KGuZnVRJSXitb9st3sHh0OlY5JjRL4D-pHzTiy5oG7phukqqBRaDK98UQ/exec";
  const API_KEY = "FC_PUERI2026";

  const campoBusca = document.getElementById('campoBusca');
  const resultadosDiv = document.getElementById('resultados');
  const cardBusca = document.getElementById('cardBusca');
  const cardCrianca = document.getElementById('cardCrianca');
  const cardAtendimento = document.getElementById('cardAtendimento');
  const nomeCriancaEl = document.getElementById('nomeCrianca');
  const infoCriancaEl = document.getElementById('infoCrianca');
  const areaListaAgendados = document.getElementById('areaListaAgendados');
  const btnTrocar = document.getElementById('btnTrocar');
  const resumoConsulta = document.getElementById('resumoConsulta');
  const statusSelect = document.getElementById('status');
  const camposMedida = document.getElementById('camposMedida');
  const formAtendimento = document.getElementById('formAtendimento');
  const aviso = document.getElementById('aviso');
  const linkReagendar = document.getElementById('linkReagendar');

  let criancaAtual = null;
  let atendimentoAtual = null;
  let timeoutBusca = null;

  campoBusca.addEventListener('input', function () {
    clearTimeout(timeoutBusca);
    const termo = campoBusca.value.trim();
    if (termo.length < 3) { resultadosDiv.innerHTML = ''; return; }
    timeoutBusca = setTimeout(function () { buscarCriancas(termo); }, 350);
  });

  async function buscarCriancas(termo) {
    resultadosDiv.innerHTML = '<p style="font-size:13px;color:#5F7A85;">Buscando...</p>';
    try {
      const url = API_URL + "?action=buscarCrianca&apiKey=" + encodeURIComponent(API_KEY) + "&termo=" + encodeURIComponent(termo);
      const resposta = await fetch(url);
      const resultado = await resposta.json();

      if (!resultado.ok || resultado.resultados.length === 0) {
        resultadosDiv.innerHTML = '<p style="font-size:13px;color:#5F7A85;">Nenhuma criança encontrada.</p>';
        return;
      }

      resultadosDiv.innerHTML = '';
      resultado.resultados.forEach(function (c) {
        const div = document.createElement('div');
        div.className = 'resultado-busca';
        div.innerHTML = '<strong>' + c.nome + '</strong><span>' + c.idCrianca + ' - Nasc: ' + formatarDataBR(c.dataNascimento) + '</span>';
        div.addEventListener('click', function () { selecionarCrianca(c); });
        resultadosDiv.appendChild(div);
      });
    } catch (err) {
      resultadosDiv.innerHTML = '<p style="font-size:13px;color:var(--alerta);">Erro na busca: ' + err.message + '</p>';
    }
  }

  function selecionarCrianca(c) {
    criancaAtual = c;
    nomeCriancaEl.textContent = c.nome;
    infoCriancaEl.textContent = c.idCrianca + ' • Nasc: ' + formatarDataBR(c.dataNascimento) + (c.acs ? ' • ACS: ' + c.acs : '');
    cardBusca.classList.add('oculto');
    cardCrianca.classList.remove('oculto');
    cardAtendimento.classList.add('oculto');
    campoBusca.value = '';
    resultadosDiv.innerHTML = '';
    carregarAgendados(c.idCrianca);
  }

  btnTrocar.addEventListener('click', function () {
    criancaAtual = null;
    cardCrianca.classList.add('oculto');
    cardAtendimento.classList.add('oculto');
    cardBusca.classList.remove('oculto');
  });

  async function carregarAgendados(idCrianca) {
    areaListaAgendados.innerHTML = '<p style="font-size:13px;color:#5F7A85;margin-top:10px;">Buscando consultas agendadas...</p>';
    try {
      const url = API_URL + "?action=listarAtendimentosAgendados&apiKey=" + encodeURIComponent(API_KEY) + "&idCrianca=" + encodeURIComponent(idCrianca);
      const resposta = await fetch(url);
      const resultado = await resposta.json();

      if (!resultado.ok) {
        areaListaAgendados.innerHTML = '<div class="aviso erro" style="display:block;margin-top:10px;">Erro: ' + resultado.erro + '</div>';
        return;
      }

      if (resultado.atendimentos.length === 0) {
        areaListaAgendados.innerHTML = '<p style="font-size:13px;color:#5F7A85;margin-top:10px;">Nenhuma consulta agendada em aberto para essa criança. Agende primeiro na tela de Agendamento.</p>';
        return;
      }

      areaListaAgendados.innerHTML = '<label style="margin-top:14px;">Consultas agendadas em aberto</label>';
      resultado.atendimentos.forEach(function (a) {
        const div = document.createElement('div');
        div.className = 'item-agendado';
        div.innerHTML = '<strong>' + formatarDataBR(a.dataAtendimento) + ' - ' + a.profissional + '</strong><span>' + a.tipoAtendimento + (a.numeroConsulta ? ' • Consulta ' + a.numeroConsulta + '/9' : '') + '</span>';
        div.addEventListener('click', function () { selecionarAtendimento(a); });
        areaListaAgendados.appendChild(div);
      });
    } catch (err) {
      areaListaAgendados.innerHTML = '<div class="aviso erro" style="display:block;margin-top:10px;">Falha: ' + err.message + '</div>';
    }
  }

  function selecionarAtendimento(a) {
    atendimentoAtual = a;
    resumoConsulta.textContent = formatarDataBR(a.dataAtendimento) + ' - ' + a.profissional + ' (' + a.tipoAtendimento + ')';
    cardAtendimento.classList.remove('oculto');
    statusSelect.value = 'Compareceu';
    atualizarVisibilidadeMedidas();
    aviso.className = 'aviso';
    linkReagendar.classList.add('oculto');
    linkReagendar.href = 'agendamento.html?idCrianca=' + encodeURIComponent(criancaAtual.idCrianca);
    cardAtendimento.scrollIntoView({ behavior: 'smooth' });
  }

  statusSelect.addEventListener('change', atualizarVisibilidadeMedidas);
  function atualizarVisibilidadeMedidas() {
    if (statusSelect.value === 'Compareceu') {
      camposMedida.classList.add('visivel');
    } else {
      camposMedida.classList.remove('visivel');
    }
    linkReagendar.classList.toggle('oculto', statusSelect.value !== 'Remarcado');
  }

  formAtendimento.addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn = document.getElementById('btnSalvar');
    btn.disabled = true;
    btn.textContent = 'Salvando...';
    aviso.className = 'aviso';

    try {
      const resposta = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'atualizarAtendimento',
          apiKey: API_KEY,
          dados: {
            idAtendimento: atendimentoAtual.idAtendimento,
            status: statusSelect.value,
            pesoKg: document.getElementById('pesoKg').value,
            alturaCm: document.getElementById('alturaCm').value,
            observacoes: document.getElementById('observacoes').value,
          }
        })
      });
      const resultado = await resposta.json();

      if (resultado.ok) {
        aviso.className = 'aviso sucesso';
        aviso.textContent = 'Atendimento atualizado com sucesso!';
        if (statusSelect.value === 'Remarcado') {
          linkReagendar.classList.remove('oculto');
        }
        carregarAgendados(criancaAtual.idCrianca);
      } else {
        aviso.className = 'aviso erro';
        aviso.textContent = 'Erro: ' + resultado.erro;
      }
    } catch (err) {
      aviso.className = 'aviso erro';
      aviso.textContent = 'Falha de conexão: ' + err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Salvar atendimento';
    }
  });

  function formatarDataBR(iso) {
    if (!iso) return '';
    const partes = iso.split('-');
    if (partes.length !== 3) return iso;
    return partes[2] + '/' + partes[1] + '/' + partes[0];
  }
</script>

</body>
</html>
